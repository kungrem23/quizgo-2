<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .shadow { filter: drop-shadow(0 4px 16px rgba(33, 27, 61, 0.08)); }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F7F7FC"/>

  <!-- Верхняя строка -->
  <text x="24" y="70" class="bold" font-size="20" fill="#7047EB">QuizGo</text>
  <rect x="280" y="52" width="86" height="26" rx="13" fill="#EBF9F1"/>
  <text x="323" y="69" class="semi" font-size="12" fill="#16A34A" text-anchor="middle">● В сети</text>

  <!-- Карточка игрока -->
  <g class="shadow" transform="translate(24, 140)">
    <rect width="342" height="420" rx="16" fill="#FFFFFF" stroke="#E2DFED" stroke-width="1"/>
    
    <circle cx="171" cy="90" r="44" fill="#F0EDFB"/>
    <text x="171" y="102" class="bold" font-size="32" fill="#7047EB" text-anchor="middle">M</text>

    <text x="171" y="165" class="bold" font-size="22" fill="#211B3D" text-anchor="middle">MaxPower</text>
    <text x="171" y="190" class="regular" font-size="14" fill="#858198" text-anchor="middle">Вы в игре!</text>

    <line x1="40" y1="225" x2="302" y2="225" stroke="#E2DFED" stroke-width="1"/>

    <!-- Статус ожидания -->
    <circle cx="171" cy="275" r="16" fill="#FEF3C7"/>
    <circle cx="171" cy="275" r="6" fill="#D97706"/>

    <text x="171" y="325" class="bold" font-size="17" fill="#211B3D" text-anchor="middle">Ждём старта игры</text>
    <text x="171" y="352" class="regular" font-size="14" fill="#858198" text-anchor="middle">Ведущий запустит викторину скоро</text>
    <text x="171" y="380" class="medium" font-size="13" fill="#7047EB" text-anchor="middle">В комнате уже 8 участников</text>
  </g>

  <rect x="127" y="828" width="136" height="5" rx="2.5" fill="#211B3D" opacity="0.3"/>
</svg>
