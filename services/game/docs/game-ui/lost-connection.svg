<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .shadow { filter: drop-shadow(0 4px 16px rgba(33, 27, 61, 0.15)); }
    </style>
  </defs>

  <!-- Приглушенный фон игры -->
  <rect width="390" height="844" fill="#F7F7FC"/>
  <rect width="390" height="844" fill="#211B3D" opacity="0.4"/>

  <!-- Плашка реконнекта -->
  <g class="shadow" transform="translate(24, 60)">
    <rect width="342" height="80" rx="14" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="2"/>
    
    <!-- Индикатор попытки соединения -->
    <circle cx="50" cy="40" r="16" fill="#FEF3C7"/>
    <circle cx="50" cy="40" r="6" fill="#D97706"/>

    <text x="80" y="34" class="bold" font-size="15" fill="#211B3D">Восстанавливаем связь…</text>
    <text x="80" y="56" class="regular" font-size="13" fill="#858198">Попытка 2 из 5. Не закрывайте окно</text>
  </g>

  <!-- Модальное окно с пояснением -->
  <g class="shadow" transform="translate(24, 300)">
    <rect width="342" height="220" rx="16" fill="#FFFFFF"/>
    
    <text x="171" y="60" class="bold" font-size="18" fill="#211B3D" text-anchor="middle">Потерян сигнал Wi-Fi или LTE</text>
    <text x="171" y="95" class="regular" font-size="14" fill="#858198" text-anchor="middle">
      <tspan x="171" dy="0">Все ваши очки и результаты</tspan>
      <tspan x="171" dy="22">сохранены на сервере.</tspan>
    </text>

    <rect x="40" y="140" width="262" height="48" rx="12" fill="#7047EB"/>
    <text x="171" y="170" class="semi" font-size="15" fill="#FFFFFF" text-anchor="middle">Переподключиться вручную</text>
  </g>
</svg>
