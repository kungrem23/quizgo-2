<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .tnum { font-variant-numeric: tabular-nums; }
      .card-shadow { filter: drop-shadow(0 6px 20px rgba(33, 27, 61, 0.06)); }
      .timer-shadow { filter: drop-shadow(0 4px 14px rgba(112, 71, 235, 0.2)); }
      .tile-shadow { filter: drop-shadow(0 4px 12px rgba(33, 27, 61, 0.08)); }
    </style>

    <linearGradient id="hostImgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>

    <!-- Текстура сетки внутри карточки иллюстрации -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2DFED" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Фон экрана -->
  <rect width="1440" height="900" fill="#F7F7FC"/>

  <!-- ================= ВЕРХНИЙ БАР (HEADER) ================= -->
  <rect width="1440" height="68" fill="#FFFFFF" stroke="#E2DFED" stroke-width="1"/>
  <text x="48" y="42" class="bold" font-size="24" fill="#7047EB" letter-spacing="-0.5">QuizGo</text>
  
  <rect x="156" y="18" width="130" height="32" rx="16" fill="#F0EDFB"/>
  <text x="221" y="39" class="semi" font-size="13" fill="#7047EB" text-anchor="middle">Вопрос 3 из 10</text>

  <!-- Прогресс сбора ответов -->
  <g transform="translate(1030, 20)">
    <rect width="220" height="28" rx="14" fill="#F7F7FC" stroke="#E2DFED" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#16A34A"/>
    <text x="30" y="19" class="medium" font-size="13" fill="#211B3D">
      Ответили: <tspan class="bold tnum" fill="#7047EB">18</tspan> из 24
    </text>
  </g>

  <!-- Кнопка закрытия вопроса -->
  <rect x="1274" y="16" width="118" height="36" rx="10" fill="#FFEBEB" stroke="#E84D66" stroke-width="1"/>
  <text x="1333" y="39" class="semi" font-size="13" fill="#E84D66" text-anchor="middle">Закрыть</text>

  <!-- ================= ТЕКСТ ВОПРОСА С ТАЙМЕРОМ ================= -->
  <g class="card-shadow" transform="translate(120, 88)">
    <rect width="1200" height="74" rx="16" fill="#FFFFFF" stroke="#E2DFED" stroke-width="1"/>
    
    <!-- Таймер круговой слева -->
    <g class="timer-shadow" transform="translate(52, 37)">
      <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#E2DFED" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#7047EB" stroke-width="4.5"
              stroke-dasharray="163" stroke-dashoffset="65" stroke-linecap="round"
              transform="rotate(-90 0 0)"/>
      <text x="0" y="5" class="bold tnum" font-size="16" fill="#211B3D" text-anchor="middle">18</text>
    </g>

    <!-- Текст вопроса -->
    <text x="100" y="45" class="bold" font-size="23" fill="#211B3D">
      Какое физическое явление продемонстрировано на данной схеме опыта?
    </text>
  </g>

  <!-- ================= ГЛАВНЫЙ АКЦЕНТ: БОЛЬШАЯ КАРТИНКА ================= -->
  <!-- Размер 920x390 px по центру экрана -->
  <g class="card-shadow" transform="translate(260, 180)">
    <rect width="920" height="390" rx="20" fill="url(#hostImgGrad)" stroke="#E2DFED" stroke-width="1.5"/>
    <rect width="920" height="390" rx="20" fill="url(#gridPattern)"/>

    <!-- Стилизованная физическая схема высокого разрешения -->
    <!-- Пластина катода/анода -->
    <rect x="230" y="110" width="22" height="170" rx="4" fill="#858198"/>
    <rect x="668" y="110" width="22" height="170" rx="4" fill="#858198"/>
    
    <!-- Вакуумная колба -->
    <rect x="200" y="80" width="520" height="230" rx="115" fill="none" stroke="#B5A1F8" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Входящие кванты света / фотоны -->
    <path d="M 80 120 Q 130 100 170 140 T 225 155" fill="none" stroke="#7047EB" stroke-width="4" stroke-linecap="round"/>
    <path d="M 80 170 Q 130 150 170 190 T 225 195" fill="none" stroke="#7047EB" stroke-width="4" stroke-linecap="round"/>
    <path d="M 80 220 Q 130 200 170 240 T 225 235" fill="none" stroke="#7047EB" stroke-width="4" stroke-linecap="round"/>

    <!-- Выбитые электроны e- -->
    <circle cx="330" cy="160" r="10" fill="#E5484D"/>
    <text x="330" y="164" class="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">e⁻</text>
    <path d="M 345 160 L 415 160" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="4 4"/>

    <circle cx="430" cy="210" r="10" fill="#E5484D"/>
    <text x="430" y="214" class="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">e⁻</text>
    <path d="M 445 210 L 515 210" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="4 4"/>

    <circle cx="370" cy="245" r="10" fill="#E5484D"/>
    <text x="370" y="249" class="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">e⁻</text>
    <path d="M 385 245 L 455 245" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="4 4"/>

    <!-- Бейдж-подпись к диаграмме -->
    <rect x="360" y="335" width="200" height="32" rx="16" fill="#FFFFFF" stroke="#E2DFED" stroke-width="1"/>
    <text x="460" y="356" class="semi" font-size="13" fill="#7047EB" text-anchor="middle">Схема эксперимента hν → e⁻</text>
  </g>

  <!-- ================= ВАРИАНТЫ ОТВЕТОВ ВНИЗУ (КОМПАКТНЫЕ ПЛАШКИ 2x2) ================= -->
  <!-- Ответ 1: ▲ Красный -->
  <g class="tile-shadow" transform="translate(120, 595)">
    <rect width="585" height="125" rx="14" fill="#E5484D"/>
    <rect x="20" y="20" width="46" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="43" y="52" class="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">▲</text>
    <text x="80" y="48" class="bold" font-size="21" fill="#FFFFFF">Фотоэлектрический эффект</text>
    <text x="80" y="78" class="medium" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Эмиссия электронов под действием падающего света</text>
  </g>

  <!-- Ответ 2: ◆ Синий -->
  <g class="tile-shadow" transform="translate(735, 595)">
    <rect width="585" height="125" rx="14" fill="#2F68EE"/>
    <rect x="20" y="20" width="46" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="43" y="52" class="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">◆</text>
    <text x="80" y="48" class="bold" font-size="21" fill="#FFFFFF">Эффект Доплера</text>
    <text x="80" y="78" class="medium" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Изменение частоты волны относительно наблюдателя</text>
  </g>

  <!-- Ответ 3: ● Янтарный -->
  <g class="tile-shadow" transform="translate(120, 735)">
    <rect width="585" height="125" rx="14" fill="#D97706"/>
    <rect x="20" y="20" width="46" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="43" y="52" class="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">●</text>
    <text x="80" y="48" class="bold" font-size="21" fill="#FFFFFF">Дифракция электронов</text>
    <text x="80" y="78" class="medium" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Волновое рассеяние частиц на кристаллической решетке</text>
  </g>

  <!-- Ответ 4: ■ Зелёный -->
  <g class="tile-shadow" transform="translate(735, 735)">
    <rect width="585" height="125" rx="14" fill="#16A34A"/>
    <rect x="20" y="20" width="46" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="43" y="52" class="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">■</text>
    <text x="80" y="48" class="bold" font-size="21" fill="#FFFFFF">Дисперсия света</text>
    <text x="80" y="78" class="medium" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Зависимость показателя преломления от длины волны</text>
  </g>
</svg>
