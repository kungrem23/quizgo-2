<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .shadow { filter: drop-shadow(0 8px 30px rgba(33, 27, 61, 0.16)); }
    </style>
  </defs>

  <!-- Затемненный фон активной игры -->
  <rect width="390" height="844" fill="#211B3D" opacity="0.6"/>

  <!-- Модальное окно -->
  <g class="shadow" transform="translate(24, 230)">
    <rect width="342" height="360" rx="20" fill="#FFFFFF"/>
    
    <!-- Иконка двух окон -->
    <circle cx="171" cy="70" r="36" fill="#F0EDFB"/>
    <text x="171" y="82" class="bold" font-size="28" fill="#7047EB" text-anchor="middle">🗂</text>

    <text x="171" y="140" class="bold" font-size="20" fill="#211B3D" text-anchor="middle">Игра уже открыта</text>
    
    <text x="171" y="175" class="regular" font-size="14" fill="#858198" text-anchor="middle">
      <tspan x="171" dy="0">Вы открыли викторину</tspan>
      <tspan x="171" dy="22">в другой вкладке или окне.</tspan>
      <tspan x="171" dy="22">Продолжите там, чтобы не потерять очки.</tspan>
    </text>

    <!-- Основное действие -->
    <rect x="24" y="250" width="294" height="48" rx="12" fill="#7047EB"/>
    <text x="171" y="280" class="semi" font-size="15" fill="#FFFFFF" text-anchor="middle">Переключить игру на эту вкладку</text>

    <!-- Вторичное действие -->
    <text x="171" y="325" class="medium" font-size="14" fill="#858198" text-anchor="middle">Закрыть эту вкладку</text>
  </g>

  <rect x="127" y="828" width="136" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
</svg>
