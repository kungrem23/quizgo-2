<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .shadow { filter: drop-shadow(0 4px 16px rgba(33, 27, 61, 0.08)); }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F7F7FC"/>

  <text x="195" y="110" class="bold" font-size="28" fill="#7047EB" text-anchor="middle">QuizGo</text>

  <g class="shadow" transform="translate(24, 160)">
    <rect width="342" height="360" rx="16" fill="#FFFFFF" stroke="#E2DFED" stroke-width="1"/>
    
    <!-- Бейдж найденной игры -->
    <rect x="24" y="28" width="294" height="40" rx="8" fill="#EBF9F1" stroke="#16A34A" stroke-width="1"/>
    <text x="40" y="53" class="medium" font-size="13" fill="#16A34A">✓ Квиз найден: Квантовая физика</text>

    <text x="24" y="105" class="bold" font-size="20" fill="#211B3D">Как вас зовут?</text>
    
    <!-- Инпут никнейма -->
    <rect x="24" y="130" width="294" height="52" rx="12" fill="#F7F7FC" stroke="#7047EB" stroke-width="2"/>
    <text x="40" y="162" class="semi" font-size="16" fill="#211B3D">MaxPower</text>
    <text x="290" y="162" class="regular" font-size="12" fill="#858198">8/30</text>

    <text x="24" y="206" class="regular" font-size="13" fill="#858198">Никнейм увидят ведущий и участники</text>

    <!-- Кнопка входа -->
    <rect x="24" y="260" width="294" height="52" rx="12" fill="#7047EB"/>
    <text x="171" y="292" class="semi" font-size="16" fill="#FFFFFF" text-anchor="middle">Войти в игру</text>
  </g>

  <rect x="127" y="828" width="136" height="5" rx="2.5" fill="#211B3D" opacity="0.3"/>
</svg>
