<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <style>
      .bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .semi { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .medium { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
      .regular { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; }
      .tnum { font-variant-numeric: tabular-nums; }
      .shadow { filter: drop-shadow(0 6px 20px rgba(22, 163, 74, 0.12)); }
    </style>
  </defs>

  <rect width="390" height="844" fill="#EBF9F1"/>

  <g class="shadow" transform="translate(24, 150)">
    <rect width="342" height="480" rx="20" fill="#FFFFFF"/>
    
    <!-- Иконка успеха -->
    <circle cx="171" cy="80" r="40" fill="#DCFCE7"/>
    <text x="171" y="93" class="bold" font-size="36" fill="#16A34A" text-anchor="middle">✓</text>

    <text x="171" y="160" class="bold" font-size="28" fill="#16A34A" text-anchor="middle">Верно!</text>
    <text x="171" y="215" class="bold tnum" font-size="44" fill="#211B3D" text-anchor="middle">+870</text>
    <text x="171" y="245" class="medium" font-size="14" fill="#858198" text-anchor="middle">очков за скорость и точность</text>

    <!-- Стрик -->
    <rect x="71" y="275" width="200" height="36" rx="18" fill="#FEF3C7"/>
    <text x="171" y="298" class="semi" font-size="14" fill="#D97706" text-anchor="middle">🔥 3 правильных подряд!</text>

    <line x1="40" y1="340" x2="302" y2="340" stroke="#E2DFED" stroke-width="1"/>

    <text x="171" y="380" class="medium" font-size="15" fill="#211B3D" text-anchor="middle">Всего очков: <tspan class="bold tnum">2 450</tspan></text>
    <text x="171" y="410" class="semi" font-size="15" fill="#7047EB" text-anchor="middle">Вы на 1 месте в раунде</text>
  </g>

  <rect x="127" y="828" width="136" height="5" rx="2.5" fill="#211B3D" opacity="0.3"/>
</svg>
