x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizgo}
      POSTGRES_USER: ${POSTGRES_USER:-quizgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  quiz:
    build:
      context: .
      dockerfile: services/quiz/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      QUIZ_HTTP_PORT: "8080"
      QUIZ_GRPC_PORT: "9090"
      QUIZ_GRPC_SERVICE_TOKEN: ${QUIZ_GRPC_SERVICE_TOKEN:?Set QUIZ_GRPC_SERVICE_TOKEN in .env}
      QUIZ_GRPC_TLS_CERT_FILE: ${QUIZ_GRPC_TLS_CERT_FILE:-}
      QUIZ_GRPC_TLS_KEY_FILE: ${QUIZ_GRPC_TLS_KEY_FILE:-}
      QUIZ_GRPC_TLS_CLIENT_CA_FILE: ${QUIZ_GRPC_TLS_CLIENT_CA_FILE:-}
      QUIZ_GRPC_ALLOWED_CLIENT_URI: ${QUIZ_GRPC_ALLOWED_CLIENT_URI:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-quizgo}
      POSTGRES_USER: ${POSTGRES_USER:-quizgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-quizgo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quizgo-crud}
      JWT_TTL: ${JWT_TTL:-15m}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BROWSER_ENDPOINT: ${S3_BROWSER_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_URL_TTL: ${S3_URL_TTL:-1h}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      GAME_HTTP_PORT: "8081"
      GAME_QUIZ_GRPC_ADDRESS: quiz:9090
      GAME_REDIS_ADDRESS: redis:6379
      GAME_REDIS_PASSWORD: ${GAME_REDIS_PASSWORD:-}
      GAME_REDIS_DB: ${GAME_REDIS_DB:-0}
      GAME_TTL: ${GAME_TTL:-24h}
      GAME_INSTANCE_ID: ${GAME_INSTANCE_ID:-game-1}
      GAME_INTERNAL_URL: ${GAME_INTERNAL_URL:-http://game:8081}
      GAME_ROOM_LEASE_TTL: ${GAME_ROOM_LEASE_TTL:-15s}
      GAME_ROOM_LEASE_RENEW_INTERVAL: ${GAME_ROOM_LEASE_RENEW_INTERVAL:-5s}
      GAME_ROOM_LEASE_SAFETY_MARGIN: ${GAME_ROOM_LEASE_SAFETY_MARGIN:-1s}
      GAME_WS_MAX_MESSAGE_BYTES: ${GAME_WS_MAX_MESSAGE_BYTES:-16384}
      GAME_WS_HANDSHAKE_TIMEOUT: ${GAME_WS_HANDSHAKE_TIMEOUT:-10s}
      GAME_WS_COMMAND_TIMEOUT: ${GAME_WS_COMMAND_TIMEOUT:-5s}
      GAME_WS_WRITE_TIMEOUT: ${GAME_WS_WRITE_TIMEOUT:-5s}
      GAME_WS_PING_INTERVAL: ${GAME_WS_PING_INTERVAL:-30s}
      GAME_WS_PONG_TIMEOUT: ${GAME_WS_PONG_TIMEOUT:-10s}
      GAME_WS_PLAYER_COMMAND_RATE: ${GAME_WS_PLAYER_COMMAND_RATE:-5}
      GAME_WS_PLAYER_COMMAND_BURST: ${GAME_WS_PLAYER_COMMAND_BURST:-10}
      GAME_WS_HOST_COMMAND_RATE: ${GAME_WS_HOST_COMMAND_RATE:-10}
      GAME_WS_HOST_COMMAND_BURST: ${GAME_WS_HOST_COMMAND_BURST:-20}
      GAME_WS_INVALID_MESSAGE_LIMIT: ${GAME_WS_INVALID_MESSAGE_LIMIT:-5}
      QUIZ_GRPC_SERVICE_TOKEN: ${QUIZ_GRPC_SERVICE_TOKEN:?Set QUIZ_GRPC_SERVICE_TOKEN in .env}
      GAME_QUIZ_GRPC_CA_FILE: ${GAME_QUIZ_GRPC_CA_FILE:-}
      GAME_QUIZ_GRPC_CERT_FILE: ${GAME_QUIZ_GRPC_CERT_FILE:-}
      GAME_QUIZ_GRPC_KEY_FILE: ${GAME_QUIZ_GRPC_KEY_FILE:-}
      GAME_QUIZ_GRPC_SERVER_NAME: ${GAME_QUIZ_GRPC_SERVER_NAME:-}
    ports:
      - "127.0.0.1:${GAME_PORT:-8081}:8081"
    depends_on:
      quiz:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./services/quiz/frontend
      args:
        VITE_GAME_ORIGIN: https://${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      quiz:
        condition: service_healthy
      game:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
