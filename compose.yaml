x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizgo}
      POSTGRES_USER: ${POSTGRES_USER:-quizgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      QUIZ_HTTP_PORT: "8080"
      QUIZ_GRPC_PORT: "9090"
      QUIZ_GRPC_SERVICE_TOKEN: ${QUIZ_GRPC_SERVICE_TOKEN:?Set QUIZ_GRPC_SERVICE_TOKEN in .env}
      QUIZ_GRPC_TLS_CERT_FILE: ${QUIZ_GRPC_TLS_CERT_FILE:-}
      QUIZ_GRPC_TLS_KEY_FILE: ${QUIZ_GRPC_TLS_KEY_FILE:-}
      QUIZ_GRPC_TLS_CLIENT_CA_FILE: ${QUIZ_GRPC_TLS_CLIENT_CA_FILE:-}
      QUIZ_GRPC_ALLOWED_CLIENT_URI: ${QUIZ_GRPC_ALLOWED_CLIENT_URI:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-quizgo}
      POSTGRES_USER: ${POSTGRES_USER:-quizgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-quizgo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quizgo-crud}
      JWT_TTL: ${JWT_TTL:-15m}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BROWSER_ENDPOINT: ${S3_BROWSER_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_URL_TTL: ${S3_URL_TTL:-1h}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
