basePath: /api
definitions:
  quizhandler.AuthorAnswerResponse:
    properties:
      id:
        example: 1
        type: integer
      is_correct:
        example: true
        type: boolean
      question_id:
        example: 1
        type: integer
      text_content:
        example: Париж
        type: string
    type: object
  quizhandler.ChangeQuestionPositionRequest:
    properties:
      position:
        description: Позиция начинается с 1 и не может превышать число вопросов в
          квизе.
        example: 2
        minimum: 1
        type: integer
    required:
    - position
    type: object
  quizhandler.CreateAnswerRequest:
    properties:
      is_correct:
        default: false
        example: true
        type: boolean
      question_id:
        example: 1
        minimum: 1
        type: integer
      text_content:
        description: Текст не должен быть пустым после удаления пробелов по краям.
        example: Париж
        minLength: 1
        type: string
    required:
    - question_id
    - text_content
    type: object
  quizhandler.CreateQuestionRequest:
    properties:
      quiz_id:
        example: 1
        minimum: 1
        type: integer
      text_content:
        description: Текст не должен быть пустым после удаления пробелов по краям.
        example: Столица Франции?
        minLength: 1
        type: string
    required:
    - quiz_id
    - text_content
    type: object
  quizhandler.CreateQuizRequest:
    properties:
      title:
        description: Название не должно быть пустым после удаления пробелов по краям.
        example: География
        minLength: 1
        type: string
    required:
    - title
    type: object
  quizhandler.PublicAnswerResponse:
    properties:
      id:
        example: 1
        type: integer
      question_id:
        example: 1
        type: integer
      text_content:
        example: Париж
        type: string
    type: object
  quizhandler.QuestionResponse:
    properties:
      answers:
        description: null, если ответы отсутствуют или не были загружены.
        items:
          $ref: '#/definitions/quizhandler.PublicAnswerResponse'
        type: array
        x-nullable: true
      id:
        example: 1
        type: integer
      image_id:
        example: image-1
        type: string
      position:
        example: 1
        type: integer
      quiz_id:
        example: 1
        type: integer
      text_content:
        example: Столица Франции?
        type: string
    type: object
  quizhandler.QuizResponse:
    properties:
      author_id:
        example: 42
        type: integer
      id:
        example: 1
        type: integer
      questions:
        items:
          $ref: '#/definitions/quizhandler.QuestionResponse'
        type: array
      title:
        example: География
        type: string
    type: object
  quizhandler.UserResponse:
    properties:
      id:
        example: 42
        type: integer
      username:
        example: alice
        type: string
    type: object
  respond.ErrorResponse:
    properties:
      error:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
info:
  contact: {}
  description: |-
    HTTP API квизов, вопросов, ответов и пользователей quiz-service.
    Публичные ответы не содержат is_correct, а пользователи — хешей паролей.
  title: QuizGo CRUD API
  version: "1.0"
paths:
  /answers:
    post:
      consumes:
      - application/json
      description: Доступно только автору квиза. Если is_correct не передан, используется
        false. Тело запроса должно содержать один JSON-объект без неизвестных полей.
      parameters:
      - description: Новый ответ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quizhandler.CreateAnswerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Ответ создан; тело ответа пустое
        "400":
          description: Некорректный JSON, ID вопроса или пустой текст
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Вопрос не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать ответ
      tags:
      - answers
  /answers/{id}:
    delete:
      description: Доступно только автору квиза.
      parameters:
      - description: ID ответа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Ответ удалён; тело ответа пустое
        "400":
          description: Некорректный ID ответа
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Ответ не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить ответ
      tags:
      - answers
    get:
      description: Публичное представление ответа без признака is_correct.
      parameters:
      - description: ID ответа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quizhandler.PublicAnswerResponse'
        "400":
          description: Некорректный ID ответа
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Ответ не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить ответ
      tags:
      - answers
  /answers/{id}/author:
    get:
      description: Возвращает ответ с признаком is_correct. Доступно только автору
        квиза.
      parameters:
      - description: ID ответа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quizhandler.AuthorAnswerResponse'
        "400":
          description: Некорректный ID ответа
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Ответ не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить ответ для автора
      tags:
      - answers
  /questions:
    post:
      consumes:
      - application/json
      description: Доступно только автору квиза. Тело запроса должно содержать один
        JSON-объект без неизвестных полей.
      parameters:
      - description: Новый вопрос
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quizhandler.CreateQuestionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Вопрос создан; тело ответа пустое
        "400":
          description: Некорректный JSON, ID квиза или пустой текст
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Квиз не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать вопрос
      tags:
      - questions
  /questions/{id}:
    delete:
      description: Доступно только автору квиза.
      parameters:
      - description: ID вопроса
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Вопрос удалён; тело ответа пустое
        "400":
          description: Некорректный ID вопроса
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Вопрос не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить вопрос
      tags:
      - questions
    get:
      description: Возвращает вопрос. В текущей реализации поле answers равно null;
        ответы загружаются при получении квиза.
      parameters:
      - description: ID вопроса
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quizhandler.QuestionResponse'
        "400":
          description: Некорректный ID вопроса
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Вопрос не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить вопрос
      tags:
      - questions
  /questions/{id}/position:
    patch:
      consumes:
      - application/json
      description: Доступно только автору квиза. Позиция начинается с 1 и не может
        превышать число вопросов в квизе. Остальные вопросы сдвигаются. Тело запроса
        должно содержать один JSON-объект без неизвестных полей.
      parameters:
      - description: ID вопроса
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Новая позиция
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quizhandler.ChangeQuestionPositionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Позиция изменена; тело ответа пустое
        "400":
          description: Некорректный JSON, ID вопроса или позиция
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Недействительный токен или пользователь не является автором
            квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Вопрос не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменить позицию вопроса
      tags:
      - questions
  /quizzes:
    get:
      description: Возвращает все квизы с вопросами и ответами без признака is_correct.
        Пагинации нет.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quizhandler.QuizResponse'
            type: array
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить список квизов
      tags:
      - quizzes
    post:
      consumes:
      - application/json
      description: Автор определяется по JWT. Тело запроса должно содержать один JSON-объект
        без неизвестных полей.
      parameters:
      - description: Новый квиз
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quizhandler.CreateQuizRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Квиз создан; тело ответа пустое
        "400":
          description: Некорректный JSON или пустое название
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Отсутствует или недействителен Bearer-токен
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать квиз
      tags:
      - quizzes
  /quizzes/{id}:
    get:
      description: Возвращает квиз с вопросами и ответами без признака is_correct.
      parameters:
      - description: ID квиза
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quizhandler.QuizResponse'
        "400":
          description: Некорректный ID квиза
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Квиз не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить квиз
      tags:
      - quizzes
  /users/{authorId}/quizzes:
    get:
      description: Возвращает квизы автора с вопросами и ответами без признака is_correct.
        Если квизов нет, возвращает пустой массив.
      parameters:
      - description: ID автора
        in: path
        minimum: 1
        name: authorId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quizhandler.QuizResponse'
            type: array
        "400":
          description: Некорректный ID автора
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить квизы автора
      tags:
      - quizzes
  /users/{id}:
    get:
      description: Возвращает ID и имя пользователя. Хеш пароля не передаётся.
      parameters:
      - description: ID пользователя
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quizhandler.UserResponse'
        "400":
          description: Некорректный ID пользователя
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Получить пользователя
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Введите Bearer <JWT>. Токен можно получить через POST /auth/login
      с JSON {"username":"alice","password":"secret123"}. Поле token уже содержит
      префикс Bearer. Регистрация: POST /auth/register с теми же полями.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Создание и просмотр квизов.
  name: quizzes
- description: Создание, просмотр, удаление и изменение порядка вопросов.
  name: questions
- description: Создание, просмотр и удаление ответов.
  name: answers
- description: Публичные профили пользователей.
  name: users
